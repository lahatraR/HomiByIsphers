server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Redirections relatives : fonctionne derrière l'Ingress quel que soit le port
    absolute_redirect off;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 /HomiByIsphers/;
    }

    location /HomiByIsphers/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA : toute route inconnue renvoie index.html (React Router)
    location /HomiByIsphers/ {
        try_files $uri $uri/ /HomiByIsphers/index.html;
    }
}
