{{- if .Values.networkPolicy.enabled }}
{{- range $component, $port := dict "frontend" "http" "api" "http" }}
---
# {{ $component }} : joignable uniquement depuis le contrôleur d'ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "homi.fullname" $ }}-{{ $component }}
  labels:
    {{- include "homi.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "homi.selectorLabels" (dict "ctx" $ "component" $component) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.networkPolicy.ingressControllerNamespace }}
      ports:
        - port: {{ $port }}
{{- end }}
---
# PostgreSQL : joignable uniquement depuis l'API et le Job de migration
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "homi.postgresHost" . }}
  labels:
    {{- include "homi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "homi.selectorLabels" (dict "ctx" . "component" "postgresql") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range list "api" "migrations" }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: {{ . }}
        {{- end }}
      ports:
        - port: 5432
---
# Job de migration : n'accepte aucun trafic entrant
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "homi.fullname" . }}-migrations
  labels:
    {{- include "homi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: migrations
  policyTypes: [Ingress]
{{- end }}
