apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homi.fullname" . }}-api
  labels:
    {{- include "homi.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "homi.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "homi.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/api-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          # On démarre directement supervisord : les migrations sont gérées
          # exclusivement par le Job (migrations-job.yaml), pas au démarrage du pod.
          command: ["/usr/bin/supervisord", "-c", "/etc/supervisor/conf.d/supervisord.conf"]
          ports:
            - name: http
              containerPort: {{ .Values.api.containerPort }}
          envFrom:
            - configMapRef:
                name: {{ include "homi.fullname" . }}-api
            - secretRef:
                name: {{ include "homi.apiSecretName" . }}
          env:
            {{- include "homi.apiEnv" . | nindent 12 }}
          startupProbe:
            httpGet: { path: {{ .Values.api.probes.liveness }}, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: {{ .Values.api.probes.liveness }}, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: {{ .Values.api.probes.readiness }}, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "homi.apiSecurityContext" . | nindent 12 }}
