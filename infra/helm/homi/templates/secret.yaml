{{- if not .Values.api.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "homi.apiSecretName" . }}
  labels:
    {{- include "homi.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_SECRET: {{ required "api.secrets.appSecret est obligatoire (ou api.existingSecret)" .Values.api.secrets.appSecret | quote }}
  MAILER_DSN: {{ .Values.api.secrets.mailerDsn | quote }}
  MAILJET_API_KEY: {{ .Values.api.secrets.mailjetApiKey | quote }}
  MAILJET_API_SECRET: {{ .Values.api.secrets.mailjetApiSecret | quote }}
  EMAIL_CRON_TOKEN: {{ .Values.api.secrets.emailCronToken | quote }}
{{- end }}
{{- if not .Values.postgresql.auth.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "homi.postgresSecretName" . }}
  labels:
    {{- include "homi.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "postgresql.auth.password est obligatoire (ou postgresql.auth.existingSecret)" .Values.postgresql.auth.password | quote }}
{{- end }}
