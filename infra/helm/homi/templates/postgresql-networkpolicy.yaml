{{- if .Values.postgresql.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "homi.postgresHost" . }}
  labels:
    {{- include "homi.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "homi.selectorLabels" (dict "ctx" . "component" "postgresql") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range list "api" "migrations" }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: {{ . }}
        {{- end }}
      ports:
        - port: 5432
{{- end }}
